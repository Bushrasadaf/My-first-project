<!DOCTYPE html>
<html>
<head>
<style>
body { font-family: sans-serif; padding: 20px; }
ul { list-style: none; padding: 0; }
li { padding: 8px; border-bottom: 1px solid #ccc; display: flex; justify-content: space-between; }
.completed { text-decoration: line-through; color: gray; }
</style>
</head>
<body>
<h2>My Tasks</h2>
<input type="text" id="t">
<button onclick="add()">Add</button>
<ul id="l"></ul>
<script>
function add() {
let v = document.getElementById('t').value;
if(!v) return;
let li = document.createElement('li');
li.innerHTML = <span>${v}</span> <button onclick="this.parentElement.remove()">X</button>;
li.onclick = function() { this.classList.toggle('completed'); };
document.getElementById('l').appendChild(li);
document.getElementById('t').value = '';
}
</script>
</body>
</html>
